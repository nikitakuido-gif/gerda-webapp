<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Анкета</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.hint {
    font-size: 14px;
    color: var(--tg-theme-hint-color, #999999);
    margin: 0 0 24px;
    line-height: 1.4;
  }
  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin: 16px 0 6px;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    font-size: 16px;
    border: 1px solid var(--tg-theme-hint-color, #cccccc);
    border-radius: 10px;
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    color: var(--tg-theme-text-color, #000000);
  }
  input:focus {
    outline: none;
    border-color: var(--tg-theme-button-color, #2481cc);
  }
  .skip-note {
    margin-top: 28px;
    font-size: 13px;
    color: var(--tg-theme-hint-color, #999999);
    line-height: 1.4;
  }
</style>
</head>
<body>
  <h1>Расскажи о себе 🐾</h1>
  <p class="hint">
    Эти данные нужны для астрологии и нумерологии — чем точнее, тем глубже расклад.
    Любое поле можно оставить пустым.
  </p>

  <label for="name">Имя</label>
  <input id="name" type="text" placeholder="Алина" autocomplete="off">

  <label for="date">Дата рождения</label>
  <input id="date" type="date">

  <label for="time">Время рождения</label>
  <input id="time" type="time">

  <label for="city">Город рождения</label>
  <input id="city" type="text" placeholder="Алматы" autocomplete="off">

  <p class="skip-note">Нажми кнопку внизу, чтобы сохранить — пустые поля всегда можно дополнить позже в Профиле.</p>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const fields = {
    name: document.getElementById('name'),
    date: document.getElementById('date'),
    time: document.getElementById('time'),
    city: document.getElementById('city'),
  };

  tg.MainButton.setText('Сохранить');
  tg.MainButton.show();

  tg.MainButton.onClick(() => {
    tg.sendData(JSON.stringify({
      name: fields.name.value.trim() || null,
      birth_date: fields.date.value || null,
      birth_time: fields.time.value || null,
      birth_city: fields.city.value.trim() || null,
    }));
  });
</script>
</body>
</html>
