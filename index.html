<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Анкета</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.hint {
    font-size: 14px;
    color: var(--tg-theme-hint-color, #999999);
    margin: 0 0 24px;
    line-height: 1.4;
  }
  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin: 16px 0 6px;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    font-size: 16px;
    border: 1px solid var(--tg-theme-hint-color, #cccccc);
    border-radius: 10px;
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    color: var(--tg-theme-text-color, #000000);
  }
  input:focus {
    outline: none;
    border-color: var(--tg-theme-button-color, #2481cc);
  }
  .skip-note {
    margin-top: 28px;
    font-size: 13px;
    color: var(--tg-theme-hint-color, #999999);
    line-height: 1.4;
  }
  .hint-inline {
    font-weight: 400;
    color: var(--tg-theme-hint-color, #999999);
  }
  .gender-toggle {
    display: flex;
    gap: 8px;
  }
  .gender-btn {
    flex: 1;
    padding: 12px 14px;
    font-size: 15px;
    border: 1px solid var(--tg-theme-hint-color, #cccccc);
    border-radius: 10px;
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    color: var(--tg-theme-text-color, #000000);
    cursor: pointer;
  }
  .gender-btn.selected {
    border-color: var(--tg-theme-button-color, #2481cc);
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #ffffff);
  }
</style>
</head>
<body>
  <h1>Расскажи о себе 🐾</h1>
  <p class="hint">
    Эти данные нужны для астрологии и нумерологии — чем точнее, тем глубже расклад.
    Любое поле можно оставить пустым.
  </p>

  <label for="name">Имя</label>
  <input id="name" type="text" placeholder="Алина" autocomplete="off">

  <label for="date">Дата рождения</label>
  <input id="date" type="date">

  <label for="time">Время рождения</label>
  <input id="time" type="time">

  <label for="city">Город рождения</label>
  <input id="city" type="text" placeholder="Алматы" autocomplete="off">

  <label>Пол <span class="hint-inline">(необязательно)</span></label>
  <div class="gender-toggle">
    <button type="button" class="gender-btn" data-value="male">🙋‍♂️ Мужской</button>
    <button type="button" class="gender-btn" data-value="female">🙋‍♀️ Женский</button>
  </div>

  <p class="skip-note">Нажми кнопку внизу, чтобы сохранить — пустые поля всегда можно дополнить позже в Профиле.</p>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const fields = {
    name: document.getElementById('name'),
    date: document.getElementById('date'),
    time: document.getElementById('time'),
    city: document.getElementById('city'),
  };

  // Бот передаёт уже сохранённые данные профиля через query-параметры —
  // иначе форма при повторном открытии («Изменить данные») выглядела бы пустой,
  // хотя в профиле уже всё заполнено.
  const params = new URLSearchParams(location.search);
  if (params.get('name')) fields.name.value = params.get('name');
  if (params.get('date')) fields.date.value = params.get('date');
  if (params.get('time')) fields.time.value = params.get('time');
  if (params.get('city')) fields.city.value = params.get('city');

  // Пол — toggle-кнопки, не обычный input, поэтому храним выбор отдельно.
  const genderButtons = document.querySelectorAll('.gender-btn');
  let selectedGender = null;
  const genderParam = params.get('gender');
  if (genderParam === 'male' || genderParam === 'female') selectedGender = genderParam;

  // Черновик из localStorage — подстраховка для полей, которых ещё нет в профиле
  // (например, человек начал заполнять анкету, не сохранил и открыл её снова).
  const DRAFT_KEY = 'gerda_onboarding_draft';
  try {
    const draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || '{}');
    if (!fields.name.value && draft.name) fields.name.value = draft.name;
    if (!fields.date.value && draft.date) fields.date.value = draft.date;
    if (!fields.time.value && draft.time) fields.time.value = draft.time;
    if (!fields.city.value && draft.city) fields.city.value = draft.city;
    if (!selectedGender && (draft.gender === 'male' || draft.gender === 'female')) selectedGender = draft.gender;
  } catch (e) {}

  function renderGender() {
    genderButtons.forEach((btn) => btn.classList.toggle('selected', btn.dataset.value === selectedGender));
  }
  renderGender();
  genderButtons.forEach((btn) => btn.addEventListener('click', () => {
    selectedGender = selectedGender === btn.dataset.value ? null : btn.dataset.value;
    renderGender();
    saveDraft();
  }));

  // Если имени всё ещё нет — подставляем имя из Telegram-аккаунта.
  // Бот передаёт его параметром tg_name (надёжный источник: message.from_user.first_name) —
  // полагаться только на Telegram.WebApp.initDataUnsafe.user нельзя: на части
  // клиентов (например, Telegram Desktop) эти данные странице не передаются.
  // Дату/время рождения и город Telegram боту не сообщает вовсе — их можно
  // получить только из уже сохранённого профиля (см. query-параметры выше).
  if (!fields.name.value) {
    if (params.get('tg_name')) {
      fields.name.value = params.get('tg_name');
    } else {
      const tgUser = tg.initDataUnsafe && tg.initDataUnsafe.user;
      if (tgUser && tgUser.first_name) fields.name.value = tgUser.first_name;
    }
  }

  function saveDraft() {
    try {
      localStorage.setItem(DRAFT_KEY, JSON.stringify({
        name: fields.name.value,
        date: fields.date.value,
        time: fields.time.value,
        city: fields.city.value,
        gender: selectedGender,
      }));
    } catch (e) {}
  }
  Object.values(fields).forEach((el) => el.addEventListener('input', saveDraft));

  tg.MainButton.setText('Сохранить');
  tg.MainButton.show();

  tg.MainButton.onClick(() => {
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    tg.sendData(JSON.stringify({
      name: fields.name.value.trim() || null,
      birth_date: fields.date.value || null,
      birth_time: fields.time.value || null,
      birth_city: fields.city.value.trim() || null,
      gender: selectedGender,
    }));
  });
</script>
</body>
</html>
