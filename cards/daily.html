<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта дня</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    padding: 24px 16px;
    min-height: 100vh;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(ellipse at 50% -10%, #2a2155 0%, #110c2b 55%, #050414 100%);
    color: #f1ecff;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow-x: hidden;
  }
  body::before, body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-repeat: repeat;
  }
  body::before {
    background-image:
      radial-gradient(1.4px 1.4px at 18% 22%, #fff, transparent),
      radial-gradient(1px 1px at 38% 8%,  #fff, transparent),
      radial-gradient(1.6px 1.6px at 62% 35%, #fff, transparent),
      radial-gradient(1px 1px at 82% 14%, #fff, transparent),
      radial-gradient(1.3px 1.3px at 12% 65%, #fff, transparent),
      radial-gradient(1px 1px at 55% 78%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 90% 60%, #fff, transparent),
      radial-gradient(1px 1px at 28% 92%, #fff, transparent);
    opacity: 0.55;
    animation: twinkle 4.5s ease-in-out infinite alternate;
  }
  body::after {
    background-image:
      radial-gradient(1px 1px at 8% 38%,  #fff, transparent),
      radial-gradient(1.4px 1.4px at 47% 52%, #fff, transparent),
      radial-gradient(1px 1px at 70% 90%, #fff, transparent),
      radial-gradient(1.3px 1.3px at 95% 30%, #fff, transparent),
      radial-gradient(1px 1px at 25% 12%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 78% 75%, #fff, transparent);
    opacity: 0.35;
    animation: twinkle 6s ease-in-out infinite alternate-reverse;
  }
  @keyframes twinkle {
    from { opacity: 0.2; }
    to   { opacity: 0.85; }
  }
  body > * { position: relative; z-index: 1; }
  h1 { font-size: 18px; margin: 0 0 6px; text-align: center; }
  p.hint {
    font-size: 14px;
    color: #b8aee0;
    margin: 0 0 28px;
    text-align: center;
    line-height: 1.4;
    max-width: 340px;
  }

  /* 2+1 grid: две карты в первой строке, одна по центру во второй */
  .grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 18px;
    width: 100%;
    max-width: 340px;
    padding: 6px 4px 14px;
  }
  .card {
    flex: 0 0 auto;
    width: 42%;
    max-width: 148px;
    min-width: 96px;
    aspect-ratio: 2 / 3;
    perspective: 800px;
    cursor: pointer;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 8px;
    transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1), box-shadow 0.4s ease;
    transform-style: preserve-3d;
  }
  .card.glow .card-inner {
    box-shadow: 0 0 18px 5px var(--tg-theme-button-color, #d9a441);
  }
  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }
  .card.picked-other {
    opacity: 0.35;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 8px;
    overflow: hidden;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
  }
  .card-face img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card-face img.reversed { transform: rotate(180deg); }
  .card-back { background: #2b2440; }
  .card-front {
    transform: rotateY(180deg);
    background: linear-gradient(160deg, #3a2f55, #6b4f8a);
    padding: 6px;
    box-sizing: border-box;
  }
  .card-front .placeholder {
    font-size: 12px;
    line-height: 1.3;
    text-align: center;
    color: #f1e9ff;
    word-break: break-word;
  }
  .card-front .placeholder.reversed { transform: rotate(180deg); }
  .status {
    margin-top: 24px;
    font-size: 14px;
    color: #b8aee0;
    text-align: center;
    min-height: 20px;
  }
  .close-btn {
    margin-top: 18px;
    border: none;
    border-radius: 999px;
    padding: 13px 30px;
    font-size: 15px;
    font-weight: 600;
    color: #1c1430;
    background: #d9a441;
    cursor: pointer;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s ease;
  }
  .close-btn.visible { opacity: 1; visibility: visible; }

  /* Просмотр карты крупным планом */
  .detail-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px;
    box-sizing: border-box;
    background: rgba(5, 4, 18, 0.92);
    backdrop-filter: blur(2px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease;
    overflow: hidden;
  }
  .detail-overlay.open { opacity: 1; visibility: visible; }
  .detail-card {
    width: min(62vw, 280px);
    aspect-ratio: 2 / 3;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #3a2f55, #6b4f8a);
    transform-origin: center center;
  }
  .detail-rotate {
    border: 1.5px solid rgba(255, 255, 255, 0.22);
    border-radius: 999px;
    padding: 8px 22px;
    font-size: 14px;
    font-weight: 500;
    color: #c9c0f0;
    background: transparent;
    cursor: pointer;
  }
  .detail-card img { width: 100%; height: 100%; object-fit: cover; }
  .detail-card img.reversed { transform: rotate(180deg); }
  .detail-card .placeholder {
    font-size: 20px;
    line-height: 1.3;
    text-align: center;
    color: #f1e9ff;
    padding: 16px;
  }
  .detail-card .placeholder.reversed { transform: rotate(180deg); }
  .detail-name { font-size: 15px; color: #e7e0ff; text-align: center; }
  .detail-name .tag {
    display: block;
    margin-top: 2px;
    font-size: 12px;
    color: #b8aee0;
    font-style: italic;
  }
  .detail-close {
    border: none;
    border-radius: 999px;
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 600;
    color: #1c1430;
    background: #d9a441;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>Карта дня 🌅</h1>
  <p class="hint">Три карты лежат рубашкой вверх 🌙<br><br>Остановись на секунду. Выбери одну — ту, к которой потянется взгляд.<br>Это твоя карта дня.<br>Заверши расклад кнопкой «Закрыть расклад».</p>

  <div class="grid" id="grid"></div>
  <p class="status" id="status">Коснись карты, которая тебя притягивает</p>
  <button class="close-btn" id="closeBtn">✦ Получить расшифровку</button>

  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-card" id="detailCard"></div>
    <p class="detail-name" id="detailName"></p>
    <button class="detail-rotate" id="rotateBtn">↻ Повернуть</button>
    <button class="detail-close" id="detailClose">← Вернуться</button>
  </div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const params = new URLSearchParams(location.search);
  let cards = [];
  try { cards = JSON.parse(params.get('cards') || '[]'); } catch (e) {}
  const backUrl = params.get('back') || '';

  const TOTAL_SLOTS = 3;
  const PICK_COUNT = 1;
  const GLOW_MS = 2000;
  const HOLD_MS = 5000;

  const grid = document.getElementById('grid');
  const status = document.getElementById('status');
  const closeBtn = document.getElementById('closeBtn');
  const overlay = document.getElementById('detailOverlay');
  const detailCard = document.getElementById('detailCard');
  const detailName = document.getElementById('detailName');
  const detailClose = document.getElementById('detailClose');

  let pickedIndex = -1;
  let pickedCardEl = null;
  const cardEls = [];

  for (let i = 0; i < TOTAL_SLOTS; i++) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="card-inner">' +
        '<div class="card-face card-back"><img src="' + backUrl + '" alt=""></div>' +
        '<div class="card-face card-front"></div>' +
      '</div>';
    card.addEventListener('click', () => onCardClick(card, i));
    grid.appendChild(card);
    cardEls.push(card);
  }

  function onCardClick(card, idx) {
    if (card.classList.contains('flipped')) {
      openDetail(cards[idx]);
      return;
    }
    if (pickedIndex !== -1) return;  // уже выбрана
    pick(card, idx);
  }

  function pick(card, idx) {
    pickedIndex = idx;
    pickedCardEl = card;

    // Остальные карты затемняются
    cardEls.forEach((el, i) => {
      if (i !== idx) el.classList.add('picked-other');
    });

    status.textContent = 'Карта открывается...';
    card.classList.add('glow');

    setTimeout(() => {
      card.classList.remove('glow');
      const data = cards[idx];
      const front = card.querySelector('.card-front');
      front.appendChild(buildFace(data));
      card.classList.add('flipped', 'glow');

      setTimeout(() => {
        card.classList.remove('glow');
        status.textContent = 'Это твоя карта дня ✨';
        closeBtn.classList.add('visible');
      }, HOLD_MS);
    }, GLOW_MS);
  }

  function buildFace(data) {
    if (!data) return document.createDocumentFragment();
    if (data.image) {
      const img = document.createElement('img');
      img.src = data.image;
      img.alt = data.name || '';
      if (data.reversed) img.classList.add('reversed');
      return img;
    }
    const span = document.createElement('span');
    span.className = 'placeholder' + (data.reversed ? ' reversed' : '');
    span.textContent = data.name || '';
    return span;
  }

  closeBtn.addEventListener('click', () => {
    tg.sendData(JSON.stringify({ card_index: pickedIndex }));
  });

  // ── Просмотр карты крупным планом ────────────────────────────────────────

  let _dtScale = 1, _dtRot = 0, _dtX = 0, _dtY = 0;
  let _pinchDist = null, _pinchScaleStart = null;
  let _pinching = false;
  let _panStart = null, _wasPanning = false;

  function applyDetailTransform() {
    detailCard.style.transform =
      'translate(' + _dtX + 'px, ' + _dtY + 'px) scale(' + _dtScale + ') rotate(' + _dtRot + 'deg)';
  }

  function resetDetailTransform() {
    _dtScale = 1; _dtRot = 0; _dtX = 0; _dtY = 0;
    detailCard.style.transform = '';
  }

  overlay.addEventListener('touchstart', function(e) {
    if (e.touches.length === 2) {
      _pinching = true;
      _panStart = null;
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      _pinchDist = Math.hypot(dx, dy);
      _pinchScaleStart = _dtScale;
      e.preventDefault();
    } else if (e.touches.length === 1 && _dtScale > 1) {
      _panStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, tx: _dtX, ty: _dtY };
      _wasPanning = false;
      e.preventDefault();
    }
  }, { passive: false });

  overlay.addEventListener('touchmove', function(e) {
    if (e.touches.length === 2 && _pinchDist !== null) {
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      var dist = Math.hypot(dx, dy);
      _dtScale = Math.max(1, Math.min(4, _pinchScaleStart * dist / _pinchDist));
      if (_dtScale <= 1) { _dtX = 0; _dtY = 0; }
      applyDetailTransform();
      e.preventDefault();
    } else if (e.touches.length === 1 && _panStart !== null) {
      var dx = e.touches[0].clientX - _panStart.x;
      var dy = e.touches[0].clientY - _panStart.y;
      _dtX = _panStart.tx + dx;
      _dtY = _panStart.ty + dy;
      if (Math.abs(dx) > 5 || Math.abs(dy) > 5) _wasPanning = true;
      applyDetailTransform();
      e.preventDefault();
    }
  }, { passive: false });

  overlay.addEventListener('touchend', function(e) {
    if (e.touches.length < 2) {
      _pinchDist = null;
      setTimeout(function() { _pinching = false; }, 80);
    }
    if (e.touches.length === 0) {
      _panStart = null;
      setTimeout(function() { _wasPanning = false; }, 80);
    }
  });

  document.getElementById('rotateBtn').addEventListener('click', function() {
    _dtRot = (_dtRot + 90) % 360;
    applyDetailTransform();
  });

  function openDetail(data) {
    if (!data) return;
    resetDetailTransform();
    detailCard.innerHTML = '';
    detailCard.appendChild(buildFace(data));
    detailName.textContent = data.name || '';
    if (data.reversed) {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = 'перевёрнутая';
      detailName.appendChild(tag);
    }
    overlay.classList.add('open');
    tg.BackButton.show();
  }

  function closeDetail() {
    overlay.classList.remove('open');
    tg.BackButton.hide();
    resetDetailTransform();
  }

  detailClose.addEventListener('click', closeDetail);
  overlay.addEventListener('click', (e) => { if (e.target === overlay && !_pinching && !_wasPanning) closeDetail(); });
  tg.BackButton.onClick(closeDetail);
</script>
</body>
</html>
