<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Выбор карт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    padding: 24px 16px;
    min-height: 100vh;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(ellipse at 50% -10%, #2a2155 0%, #110c2b 55%, #050414 100%);
    color: #f1ecff;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow-x: hidden;
  }
  /* Звёздное небо — два слоя точек разного размера, мерцают вразнобой */
  body::before, body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-repeat: repeat;
  }
  body::before {
    background-image:
      radial-gradient(1.4px 1.4px at 18% 22%, #fff, transparent),
      radial-gradient(1px 1px at 38% 8%,  #fff, transparent),
      radial-gradient(1.6px 1.6px at 62% 35%, #fff, transparent),
      radial-gradient(1px 1px at 82% 14%, #fff, transparent),
      radial-gradient(1.3px 1.3px at 12% 65%, #fff, transparent),
      radial-gradient(1px 1px at 55% 78%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 90% 60%, #fff, transparent),
      radial-gradient(1px 1px at 28% 92%, #fff, transparent);
    opacity: 0.55;
    animation: twinkle 4.5s ease-in-out infinite alternate;
  }
  body::after {
    background-image:
      radial-gradient(1px 1px at 8% 38%,  #fff, transparent),
      radial-gradient(1.4px 1.4px at 47% 52%, #fff, transparent),
      radial-gradient(1px 1px at 70% 90%, #fff, transparent),
      radial-gradient(1.3px 1.3px at 95% 30%, #fff, transparent),
      radial-gradient(1px 1px at 25% 12%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 78% 75%, #fff, transparent);
    opacity: 0.35;
    animation: twinkle 6s ease-in-out infinite alternate-reverse;
  }
  @keyframes twinkle {
    from { opacity: 0.2; }
    to   { opacity: 0.85; }
  }
  body > * { position: relative; z-index: 1; }
  h1 { font-size: 18px; margin: 0 0 6px; text-align: center; }
  p.hint {
    font-size: 14px;
    color: #b8aee0;
    margin: 0 0 28px;
    text-align: center;
    line-height: 1.4;
    max-width: 360px;
  }
  .grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 16px;
    width: 100%;
    max-width: 360px;
    padding: 6px 4px 14px;
  }
  .card {
    /* Плитка 2-2-1: ширина ~42% контейнера — в ряд помещается ровно две карты,
       пятая остаётся одна по центру последней строки. */
    flex: 0 0 auto;
    width: 42%;
    max-width: 150px;
    min-width: 96px;
    aspect-ratio: 2 / 3;
    perspective: 800px;
    cursor: pointer;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 8px;
    transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1), box-shadow 0.4s ease;
    transform-style: preserve-3d;
  }
  .card.glow .card-inner {
    box-shadow: 0 0 18px 5px var(--tg-theme-button-color, #d9a441);
  }
  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }
  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 8px;
    overflow: hidden;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
  }
  .card-face img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card-face img.reversed {
    transform: rotate(180deg);
  }
  .card-back { background: #2b2440; }
  .card-front {
    transform: rotateY(180deg);
    background: linear-gradient(160deg, #3a2f55, #6b4f8a);
    padding: 6px;
    box-sizing: border-box;
  }
  .card-front .placeholder {
    font-size: 12px;
    line-height: 1.3;
    text-align: center;
    color: #f1e9ff;
    word-break: break-word;
  }
  .card-front .placeholder.reversed { transform: rotate(180deg); }
  .status {
    margin-top: 28px;
    font-size: 14px;
    color: #b8aee0;
    text-align: center;
    min-height: 20px;
  }
  .hint-tap {
    margin-top: 10px;
    font-size: 12px;
    color: #8d82b8;
    text-align: center;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .hint-tap.visible { opacity: 1; }

  /* Просмотр карты крупным планом — чтобы налюбоваться визуалом не торопясь */
  .detail-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px;
    box-sizing: border-box;
    background: rgba(5, 4, 18, 0.92);
    backdrop-filter: blur(2px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease;
  }
  .detail-overlay.open {
    opacity: 1;
    visibility: visible;
  }
  .detail-card {
    width: min(62vw, 280px);
    aspect-ratio: 2 / 3;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #3a2f55, #6b4f8a);
  }
  .detail-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .detail-card img.reversed { transform: rotate(180deg); }
  .detail-card .placeholder {
    font-size: 20px;
    line-height: 1.3;
    text-align: center;
    color: #f1e9ff;
    padding: 16px;
  }
  .detail-card .placeholder.reversed { transform: rotate(180deg); }
  .detail-name {
    font-size: 15px;
    color: #e7e0ff;
    text-align: center;
  }
  .detail-name .tag {
    display: block;
    margin-top: 2px;
    font-size: 12px;
    color: #b8aee0;
    font-style: italic;
  }
  .detail-close {
    border: none;
    border-radius: 999px;
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 600;
    color: #1c1430;
    background: #d9a441;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>Выбери три карты 🐾</h1>
  <p class="hint">Карты лежат рубашкой вверх. Коснись трёх — по наитию, не раздумывая. Остальные так и останутся закрытыми.</p>

  <div class="grid" id="grid"></div>
  <p class="status" id="status"></p>
  <p class="hint-tap" id="hintTap">Коснись открытой карты ещё раз — чтобы рассмотреть её крупно</p>

  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-card" id="detailCard"></div>
    <p class="detail-name" id="detailName"></p>
    <button class="detail-close" id="detailClose">← Вернуться к раскладу</button>
  </div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const params = new URLSearchParams(location.search);
  let cards = [];
  try { cards = JSON.parse(params.get('cards') || '[]'); } catch (e) {}
  const backUrl = params.get('back') || '';

  const TOTAL_SLOTS = 5;
  const PICK_COUNT = Math.min(3, cards.length);

  const GLOW_MS = 2000;     // карта светится рубашкой вверх перед переворотом
  const HOLD_MS = 5000;     // и держит внимание уже открытой — не убираем подсветку сразу
  const MIN_GAP_MS = 2000;  // следующую карту можно поднимать не раньше, чем через столько
                            // после предыдущей — но ждать её полного переворота не нужно,
                            // анимации идут параллельно

  const grid = document.getElementById('grid');
  const status = document.getElementById('status');
  const hintTap = document.getElementById('hintTap');

  const overlay = document.getElementById('detailOverlay');
  const detailCard = document.getElementById('detailCard');
  const detailName = document.getElementById('detailName');
  const detailClose = document.getElementById('detailClose');

  let pickedCount = 0;
  let completedCount = 0;
  let lastPickAt = 0;

  for (let i = 0; i < TOTAL_SLOTS; i++) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="card-inner">' +
        '<div class="card-face card-back"><img src="' + backUrl + '" alt=""></div>' +
        '<div class="card-face card-front"></div>' +
      '</div>';
    card.addEventListener('click', () => onCardClick(card));
    grid.appendChild(card);
  }

  function onCardClick(card) {
    if (card.classList.contains('flipped')) {
      openDetail(card._cardData);
    } else {
      pick(card);
    }
  }

  function pick(card) {
    if (card.classList.contains('picked') || pickedCount >= PICK_COUNT) return;
    const now = Date.now();
    if (now - lastPickAt < MIN_GAP_MS) return;
    lastPickAt = now;

    card.classList.add('picked');
    const data = cards[pickedCount];
    card._cardData = data;
    pickedCount++;
    status.textContent = pickedCount < PICK_COUNT
      ? 'Ещё ' + (PICK_COUNT - pickedCount) + (PICK_COUNT - pickedCount === 1 ? ' карта' : ' карты')
      : 'Карты раскрываются...';

    card.classList.add('glow');
    setTimeout(() => {
      card.classList.remove('glow');
      reveal(card, data);
      card.classList.add('flipped', 'glow');

      setTimeout(() => {
        card.classList.remove('glow');
        completedCount++;
        if (completedCount >= PICK_COUNT) {
          status.textContent = 'Карты легли как нужно ✨';
          hintTap.classList.add('visible');
          setTimeout(() => tg.sendData(JSON.stringify({ done: true })), 600);
        }
      }, HOLD_MS);
    }, GLOW_MS);
  }

  function reveal(card, data) {
    const front = card.querySelector('.card-front');
    front.appendChild(buildFace(data));
  }

  function buildFace(data) {
    if (!data) return document.createDocumentFragment();
    if (data.image) {
      const img = document.createElement('img');
      img.src = data.image;
      img.alt = data.name || '';
      if (data.reversed) img.classList.add('reversed');
      return img;
    }
    const span = document.createElement('span');
    span.className = 'placeholder' + (data.reversed ? ' reversed' : '');
    span.textContent = data.name || '';
    return span;
  }

  // ── Просмотр карты крупным планом ───────────────────────────────────────────

  function openDetail(data) {
    if (!data) return;
    detailCard.innerHTML = '';
    detailCard.appendChild(buildFace(data));
    detailName.textContent = data.name || '';
    if (data.reversed) {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = 'перевёрнутая';
      detailName.appendChild(tag);
    }
    overlay.classList.add('open');
    tg.BackButton.show();
  }

  function closeDetail() {
    overlay.classList.remove('open');
    tg.BackButton.hide();
  }

  detailClose.addEventListener('click', closeDetail);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeDetail();
  });
  tg.BackButton.onClick(closeDetail);

  status.textContent = 'Осталось выбрать ' + PICK_COUNT + (PICK_COUNT === 1 ? ' карту' : ' карты');
</script>
</body>
</html>
